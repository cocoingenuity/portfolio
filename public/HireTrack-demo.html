<style>
  body{margin:0}

<body>
<div id=root><div class=ht-app>
  <header class=ht-topbar>
    <div class=ht-topbar-left>
      <div class=ht-logo><div class=ht-logo-dot></div>HireTrack</div>
      <div class=ht-tabs id=htTabs></div>
    </div>
    <div class=ht-topbar-actions>
      <button class=ht-btn id=refreshBtn><i class="ti ti-refresh"></i>Refresh</button>
      <button class="ht-btn ht-btn-dark"><i class="ti ti-bolt"></i>Analyze</button>
      <button class=ht-btn title="Strategy Settings"><i class="ti ti-settings"></i>Strategy</button>
    </div>
  </header>
  <div class=ht-scrapebar id=scrapeBar>
    <span class=ht-scrapebar-label><i class="ti ti-spider"></i>Scraping…</span>
    <div class=ht-scrapebar-track><div class=ht-scrapebar-fill id=scrapeFill></div></div>
    <button class=ht-scrapebar-btn id=pauseBtn><i class="ti ti-player-pause"></i>Pause</button>
    <button class=ht-scrapebar-btn id=stopBtn><i class="ti ti-player-stop"></i>Stop</button>
  </div>

const TIER_LABEL = {strong:"Strong Match", good:"Good Match", stretch:"Stretch"};
const ICONS = {
  ai:{ "All":"ti-cpu","Analyzed":"ti-circle-check","Unanalyzed":"ti-clock" },

};
const TIER_FROM_LABEL = { "All tiers":"all","Strong match":"strong","Good match":"good","Stretch":"stretch" };
const STATUS_FROM_LABEL = { "All statuses":"all","Saved":"saved","Applied":"applied","Interview":"interview","Offer":"offer","Rejected":"rejected","Not interested":"not_interested" };
const POSTED_FROM_LABEL = { "All dates":0,"Last 24 hours":1,"Last 3 days":3,"Last 7 days":7,"Last 30 days":30 };

let state = { track:"IT Support", selected:null, tier:"all", aiFilter:"all", statusFilter:"all", postedFilter:0, sort:"best", status:{} };

function rawJobs(){ return TRACKS[state.track].jobs; }
function scorePillClass(t){ return t==="strong"?"ht-score-pill-strong":"ht-score-pill-good"; }
function statusOf(i){ return state.status[i] !== undefined ? state.status[i] : rawJobs()[i].status; }

function renderTabs(){
  const el = document.getElementById("htTabs");
  const names = Object.keys(TRACKS);
  el.innerHTML = names.map(n=>`
    <span style="position:relative;display:inline-flex;align-items:center">
      <button class="ht-tab${state.track===n?" active":""}" data-track="${n}"${state.track===n?' style=padding-right:22px':''}>${n}</button>
      ${state.track===n?`<button title="Delete" style="position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;padding:0 1px;color:var(--ht-text-3);line-height:1;font-size:11px"><i class="ti ti-x"></i></button>`:''}
    </span>`).join("") +
    `<button class=ht-tab title="Add new track" style=opacity:0.6><i class="ti ti-plus" style=font-size:13px></i></button>`;
  el.querySelectorAll(".ht-tab[data-track]").forEach(b=>{
    b.addEventListener("click",()=>{
      if(state.track===b.dataset.track) return;
      state.track=b.dataset.track; state.selected=null; state.tier="all";
      state.aiFilter="all"; state.statusFilter="all"; state.postedFilter=0; state.status={};
      renderAll();
    });
  });
}

function sideGroup(label, items, key){
  const rows = items.map(([name,count])=>{
    const icon = ICONS[key][name] || "ti-circle";
    let active=false, dataAttr="";
    if(key==="match"){ const v=TIER_FROM_LABEL[name]; active=(state.tier===v); dataAttr=` data-group=match data-val="${v}"`; }
    else if(key==="ai"){ const v=name==="All"?"all":name.toLowerCase(); active=(state.aiFilter===v); dataAttr=` data-group=ai data-val="${v}"`; }
    else if(key==="status"){ const v=STATUS_FROM_LABEL[name]; active=(state.statusFilter===v); dataAttr=` data-group=status data-val="${v}"`; }
    else if(key==="posted"){ const v=POSTED_FROM_LABEL[name]; active=(state.postedFilter===v); dataAttr=` data-group=posted data-val="${v}"`; }
    const cnt = (count!==null&&count!==undefined) ? `<span class=ht-filter-count>${count}</span>` : "";
    return `<button class="ht-filter-item${active?" active":""}"${dataAttr}><i class="ti ${icon}"></i><span>${name}</span>${cnt}</button>`;
  }).join("");
  return `<div class=ht-filter-group><div class=ht-filter-label>${label}</div>${rows}</div>`;
}

function renderSidebar(){
  const c = TRACKS[state.track].counts;
  document.getElementById("sidebar").innerHTML =
    sideGroup("AI Analysis", c.ai, "ai") + '<div class=ht-sidebar-divider></div>' +
    sideGroup("Match level", c.match, "match") + '<div class=ht-sidebar-divider></div>' +
    sideGroup("Status", c.status, "status") + '<div class=ht-sidebar-divider></div>' +
    sideGroup("Posted", c.posted, "posted");
  document.querySelectorAll('.ht-filter-item[data-group]').forEach(btn=>{
    btn.addEventListener("click",()=>{
      const g=btn.dataset.group, v=btn.dataset.val;
      if(g==="match") state.tier=v;
      else if(g==="ai") state.aiFilter=v;
      else if(g==="status") state.statusFilter=v;
      else if(g==="posted") state.postedFilter=+v;
      const vis=visibleJobs();
      if(!vis.some(j=>j._i===state.selected)) state.selected = vis.length?vis[0]._i:null;
      renderSidebar(); renderList(); renderDetail();
    });
  });
}

function visibleJobs(){
  let list = rawJobs().map((j,i)=>({...j,_i:i}));
  if(state.tier!=="all") list=list.filter(j=>j.tier===state.tier);
  if(state.aiFilter!=="all") list=list.filter(j=> state.aiFilter==="analyzed" ? j.analyzed : !j.analyzed);
  if(state.statusFilter!=="all") list=list.filter(j=> statusOf(j._i)===state.statusFilter);
  if(state.postedFilter>0) list=list.filter(j=> j.daysAgo<=state.postedFilter);
  if(state.sort==="best") list.sort((a,b)=>b.score-a.score);
  else list.sort((a,b)=>a.daysAgo-b.daysAgo);
  return list;
}

function renderList(){
  const list=visibleJobs();
  document.getElementById("jobCount").textContent=list.length+" jobs";
  const el=document.getElementById("jobList");
  if(!list.length){ el.innerHTML=`<div class=ht-empty>No jobs match these filters.</div>`; return; }
  el.innerHTML=list.map(j=>`
    <div class="ht-job-card${j._i===state.selected?" selected":""}" data-i="${j._i}" tabindex=0>
      <div style="flex:1;min-width:0">
        <div class=ht-job-title>${j.title}</div>
        <div class=ht-job-meta><span>${j.company}</span><span class=ht-meta-dot></span><span>${j.loc}</span><span class=ht-meta-dot></span><span>${j.posted}</span></div>
      </div>
      <div class=ht-job-card-right>
        <span class="ht-score-pill ${scorePillClass(j.tier)}">${j.score}</span>
        <button class=ht-bookmark-btn><i class="ti ti-bookmark"></i></button>
      </div>
    </div>`).join("");
  el.querySelectorAll(".ht-job-card").forEach(card=>{
    const go=()=>{ state.selected=+card.dataset.i; renderList(); renderDetail(); };
    card.addEventListener("click",go);
    card.addEventListener("keydown",e=>{ if(e.key==="Enter") go(); });
  });
}

  const panel=document.getElementById("detailPanel");
  if(state.selected===null){ panel.innerHTML=`<div class=ht-empty style="margin-top:40px">Select a job to see the match analysis.</div>`; return; }
  const j=rawJobs()[state.selected], d=j.d, st=statusOf(state.selected);
  const scoreColor = j.tier==="strong"?"#0F6E56":(j.tier==="good"?"#3a8a68":"#9a7b2f");

  panel.innerHTML=`
    <div class=ht-detail-scroll>

      </div>
      <div class=ht-detail-body>
        <div><div class="ht-section-head green"><i class="ti ti-quote"></i>Pitch</div>

          <div class=ht-tag-list>${d.strengths.map(s=>`<div class="ht-tag green">${s}</div>`).join("")}</div></div>
        <div><div class="ht-section-head red"><i class="ti ti-alert-triangle"></i>Gaps</div>
          <div class=ht-tag-list>${d.gaps.map(s=>`<div class="ht-tag red">${s}</div>`).join("")}</div></div>
        <div><div class="ht-section-head blue"><i class="ti ti-list-check"></i>Key requirements</div>
          <div class=ht-tag-list>${d.reqs.map(s=>`<div class="ht-tag">${s}</div>`).join("")}</div></div>

          ${Object.entries(d.skills).map(([k,v])=>`<div class=ht-skill-row><span class=lbl>${k}</span><span class=ht-skill-bar><span class=ht-skill-fill style="width:${v}%"></span></span><span class=ht-skill-pct>${v}%</span></div>`).join("")}</div>

  panel.querySelectorAll(".ht-status-btn").forEach(b=>{
    b.addEventListener("click",()=>{

      renderSidebar(); renderList(); renderDetail();

  panel.querySelector(".ht-apply-btn").addEventListener("click",()=>alert("Demo only — in the live app this opens the original LinkedIn posting."));

function bindSort(){
  document.querySelectorAll(".ht-sort").forEach(btn=>{
    btn.addEventListener("click",()=>{
      document.querySelectorAll(".ht-sort").forEach(b=>{ b.classList.remove("active"); b.style.background="transparent"; b.style.color="var(--ht-text-3)"; b.style.fontWeight="400"; });
      btn.classList.add("active"); btn.style.background="#fff"; btn.style.color="var(--ht-text)"; btn.style.fontWeight="500";
      state.sort=btn.dataset.sort; renderList();
    });
  });
}

function renderAll(){
  renderTabs(); renderSidebar();
  const vis=visibleJobs();
  if(state.selected===null && vis.length) state.selected=vis[0]._i;
  renderList(); renderDetail();
}
function showToast(msg){
  const t=document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  clearTimeout(t._timer); t._timer=setTimeout(()=>t.classList.remove("show"),2600);
}

let scrape={running:false,paused:false,progress:0,timer:null};
function setRefreshIdle(){
  const b=document.getElementById("refreshBtn");
  b.className="ht-btn"; b.innerHTML=`<i class="ti ti-refresh"></i>Refresh`;
}
function setRefreshBusy(){
  const b=document.getElementById("refreshBtn");
  b.className="ht-btn scraping"; b.innerHTML=`<i class="ti ti-refresh spin"></i>Scraping…`;
}
function tickScrape(){
  if(!scrape.running||scrape.paused) return;
  // ease-out style increments so it feels organic
  const step = scrape.progress<70 ? (3+Math.random()*5) : (1+Math.random()*2.5);
  scrape.progress = Math.min(100, scrape.progress+step);
  document.getElementById("scrapeFill").style.width = scrape.progress+"%";
  if(scrape.progress>=100){ finishScrape(); }
}
function startScrape(){
  if(scrape.running) return;
  scrape={running:true,paused:false,progress:0,timer:null};
  document.getElementById("scrapeBar").classList.add("on");
  document.getElementById("scrapeFill").style.width="0%";
  setRefreshBusy();
  scrape.timer=setInterval(tickScrape,260);
}
function finishScrape(){
  clearInterval(scrape.timer); scrape.running=false;
  document.getElementById("scrapeBar").classList.remove("on");
  setRefreshIdle();
  const n = 3 + Math.floor(Math.random()*5);
  showToast(`Scrape complete — ${n} new postings found`);
}
function stopScrape(){
  clearInterval(scrape.timer); scrape.running=false; scrape.paused=false;
  document.getElementById("scrapeBar").classList.remove("on");
  setRefreshIdle();
}
function bindScrape(){
  document.getElementById("refreshBtn").addEventListener("click",startScrape);
  document.getElementById("pauseBtn").addEventListener("click",()=>{
    scrape.paused=!scrape.paused;
    const pb=document.getElementById("pauseBtn");
    pb.innerHTML = scrape.paused ? `<i class="ti ti-player-play"></i>Resume` : `<i class="ti ti-player-pause"></i>Pause`;
  });
  document.getElementById("stopBtn").addEventListener("click",stopScrape);
}

renderAll(); bindSort(); bindScrape();
</script>
</body>
</html>
